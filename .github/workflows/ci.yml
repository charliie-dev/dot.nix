# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: "CI: Nix Flake Check"
on:
  pull_request:
  push:
    branches: [main]

# id-token: write omitted — not using FlakeHub cache
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3

      - name: Run flake checks
        run: nix build .#checks.x86_64-linux.formatting --no-link

  eval-hosts:
    needs: [flake-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3
        with:
          # Evaluating the activation package runs the catppuccin whiskers IFD
          # (themes are generated by running whiskers at eval time). Without the
          # official cache the runner compiles whiskers from Rust source and the
          # 5m job times out. modules/catppuccin.nix's cache.enable only lands in
          # the to-be-installed nix.conf, which is too late for this eval.
          extra-conf: |
            extra-substituters = https://catppuccin.cachix.org
            extra-trusted-public-keys = catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=

      - name: Evaluate ${{ matrix.system }} homeConfigurations
        run: |
          # -e omitted: the `if nix eval` loop intentionally handles non-zero exits
          set -uo pipefail
          hosts=$(nix eval --file hosts.nix --apply "
            hosts: builtins.filter
              (name: hosts.\${name}.system == \"${{ matrix.system }}\" && !(hosts.\${name}.nvidiaGpu or false) && !(hosts.\${name} ? sharedConfig))
              (builtins.attrNames hosts)
          " --json) || { echo "::error::nix eval failed"; exit 1; }
          echo "Hosts: $hosts"
          count=$(jq 'length' <<< "$hosts") || { echo "::error::jq failed to parse hosts"; exit 1; }
          if [ "$count" -eq 0 ]; then
            echo "No hosts for ${{ matrix.system }}, skipping"
            exit 0
          fi
          failed=0
          while IFS= read -r host; do
            echo "::group::Evaluating $host"
            if nix eval ".#homeConfigurations.\"$host\".activationPackage.drvPath" --raw; then
              echo " ✅"
            else
              echo " ❌"
              failed=1
            fi
            echo "::endgroup::"
          done < <(jq -r '.[]' <<< "$hosts")
          if [ "$failed" -gt 0 ]; then
            echo "::error::One or more host evaluations failed"
          fi
          exit "$failed"

      # The global mise config is rendered from modules/apps/mise.nix, so a
      # wrong tool-option type there only shows up at mise runtime. Build just
      # that file per host and validate it against mise's published schema,
      # which types each backend's options. Mirrors `mise run ci:mise-schema`.
      - name: Validate rendered mise config against mise's schema
        run: |
          set -uo pipefail
          hosts=$(nix eval --file hosts.nix --apply "
            hosts: builtins.filter
              (name: hosts.\${name}.system == \"${{ matrix.system }}\" && !(hosts.\${name}.nvidiaGpu or false) && !(hosts.\${name} ? sharedConfig))
              (builtins.attrNames hosts)
          " --json) || { echo "::error::nix eval failed"; exit 1; }
          count=$(jq 'length' <<< "$hosts") || { echo "::error::jq failed to parse hosts"; exit 1; }
          if [ "$count" -eq 0 ]; then
            echo "No hosts for ${{ matrix.system }}, skipping"
            exit 0
          fi
          failed=0
          while IFS= read -r host; do
            echo "::group::mise schema $host"
            if cfg=$(nix build ".#homeConfigurations.\"$host\".config.xdg.configFile.\"mise/config.toml\".source" --no-link --print-out-paths) \
               && nix run nixpkgs#check-jsonschema -- --schemafile https://mise.jdx.dev/schema/mise.json --default-filetype toml "$cfg"; then
              echo " ✅"
            else
              echo " ❌"
              failed=1
            fi
            echo "::endgroup::"
          done < <(jq -r '.[]' <<< "$hosts")
          if [ "$failed" -gt 0 ]; then
            echo "::error::One or more rendered mise configs violate the schema"
          fi
          exit "$failed"

  bedrock-contracts:
    needs: [flake-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: charles@callisto
          - runner: ubuntu-24.04-arm
            host: charles@pluto
          - runner: macos-latest
            host: charles@24041-LABNB01
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3
        with:
          extra-conf: |
            extra-substituters = https://catppuccin.cachix.org
            extra-trusted-public-keys = catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=

      - name: Run offline Bedrock and Doppler contracts
        env:
          HM_CONFIG: ${{ matrix.host }}
        run: >-
          nix shell --inputs-from . nixpkgs#mise nixpkgs#python3 nixpkgs#jq nixpkgs#zsh
          -c mise run ci:bedrock-api-key
