# Ruler Configuration File
# See https://ai.intellectronica.net/ruler for documentation.

# Default agents to run when --agents is not specified
# Uses case-insensitive substring matching
default_agents = ["claude", "codex", "opencode"]

# --- Global MCP Server Configuration ---
[mcp]
# Enable/disable MCP propagation globally (default: true)
enabled = false

# --- Global .gitignore Configuration ---
[gitignore]
# Enable/disable automatic .gitignore updates (default: true)
enabled = true
# Write managed entries to .git/info/exclude instead of .gitignore (default: false)
local = false

# Generated agent files are disposable; .ruler/ is the source of truth.
[backup]
enabled = false

# --- Agent Specific Configurations ---
[agents.claude]
enabled = true

[agents.codex]
enabled = true

[agents.opencode]
enabled = true
