[settings]
jobs = 16
task.output = "keep-order"

# ------------------------------------------------------------------------------
[tools]
# hk.pkl 的 pre-commit secret 掃描;其他 linter 來自全域 mise 設定。
betterleaks = "1.9.0"

# ------------------------------------------------------------------------------
[env]

# ------------------------------------------------------------------------------
[task_config]
includes = [".mise/tasks"]

# ==============================================================================
#  Setup
# ==============================================================================
[tasks."setup:init"]
run = [
  "echo [INFO] Checking necessary pakcgges",
  { tasks = [
    "setup:apt-check curl",
    "setup:apt-check openssl",
    "setup:apt-check zsh",
    "setup:apt-check git",
    "setup:apt-check age",
  ] },
  { tasks = ["repo:remote-url", "setup:trusted-user", "setup:zsh"] },
  { task = "nix:daemon-restart" },
]

# ==============================================================================
#  CI — run the same gates as .github/workflows/ci.yml before pushing
# ==============================================================================
# `mise run ci` mirrors CI: formatting, host eval, rendered mise config schema,
# then offline contracts. Host evaluation and contract fixtures follow the
# current system. `mise run fmt` fixes.
[tasks.ci]
description = "Run formatting, host evaluation, mise schema check, and offline Bedrock/Doppler contracts"
run = [
  { task = "ci:fmt" },
  { task = "ci:eval" },
  { task = "ci:mise-schema" },
  { task = "ci:bedrock-api-key" },
]

# ==============================================================================
#  Herdr
# ==============================================================================
# 0.7.5 起 `herdr config check` 會報未知 key 的完整路徑;改完 herdr.nix 並
# switch 後跑這個驗證生效中的設定檔。
[tasks."herdr:check"]
description = "Validate active herdr config (reports unknown keys with full paths)"
run = "herdr config check"

# mise sync-transient-prompt: update colors in plugins.zsh after changing theme
